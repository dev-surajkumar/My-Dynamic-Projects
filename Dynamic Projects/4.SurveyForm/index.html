<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Survey Form</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <h1>freeCodeCamp Survey Form</h1>
    <p class="tilt">Thank you for taking the time to help us improve the platform</p>
    <form action="">
        <div class="reqInp">
            <label for="Name">Name</label>
        <input type="text" placeholder="Enter your name" required id="name">
        <label for="Email">Email</label>
        <input type="email" placeholder="Enter your Email" required id="email">
        <label for="Age">Age <span>(optional)</span></label>
        <input type="number" placeholder="Enter your Age" id="age">
        </div>
        
        <div class="user-select">
            <p>Which option best describes your current role?</p>
            <select name="role" id="role" >
            <option value="scr">Select current role</option>
            <option value="student">Student</option>
            <option value="ftj">Full Time Job</option>
            <option value="ftl">Full Time Learner</option>
            <option value="pnts">Prefer not to say</option>
            <option value="other">Other</option>
            </select>
        </div>
        
        <div class="user-check">
            <p>Would you recommend freeCodeCamp to a friend?</p>

            <div class="check">
                <input type="radio" id="definitely" name="recommendation" value="definitely">
                <label for="definitely">Definitely</label>
            </div>
            
            <div class="check">
                <input type="radio" id="maybe" name="recommendation" value="maybe">
                <label for="maybe">Maybe</label>
            </div>
            
            <div class="check">
                <input type="radio" id="notSure" name="recommendation" value="not_sure">
                <label for="notSure">Not sure</label>
            </div>
        </div>

        <div class="user-select">
            <p>What is your favorite feature of freeCodeCamp?</p>
        <select name="favfeat" id="favfeat">
            <option value="sao">Select an option</option>
            <option value="challenges">Challenges</option>
            <option value="Projects">Projects</option>
            <option value="community">Community</option>
            <option value="openSource">Open source</option>
        </select>
        </div>

        <div class="user-check">
            <p>What would you like to see improved? <span>(check all that apply)</span></p>
            <div class="check">
                <input type="checkbox" id="frontEnd" name="improvements" value="front-end">
                <label for="frontEnd">Front-end Projects</label>
            </div>
            <div class="check">
                <input type="checkbox" id="backEnd" name="improvements" value="back-end">
                <label for="backEnd">Back-end Projects</label>
            </div>
            <div class="check">
                <input type="checkbox" id="dataVis" name="improvements" value="data-visualization">
                <label for="dataVis">Data Visualization</label>
            </div>
            <div class="check">
                <input type="checkbox" id="challenges" name="improvements" value="challenges">
                <label for="challenges">Challenges</label>
            </div>
            <div class="check">
                <input type="checkbox" id="openSource" name="improvements" value="open-source">
                <label for="openSource">Open Source Community</label>
            </div>
            <div class="check">
                <input type="checkbox" id="gitter" name="improvements" value="gitter-help">
                <label for="gitter">Gitter help rooms</label>
            </div>
            <div class="check">
                <input type="checkbox" id="videos" name="improvements" value="videos">
                <label for="videos">Videos</label>
            </div>
            <div class="check">
                <input type="checkbox" id="meetups" name="improvements" value="city-meetups">
                <label for="meetups">City Meetups</label>
            </div>
            <div class="check">
                <input type="checkbox" id="wiki" name="improvements" value="wiki">
                <label for="wiki">Wiki</label>
            </div>
            <div class="check">
                <input type="checkbox" id="forum" name="improvements" value="forum">
                <label for="forum">Forum</label>
            </div>
            <div class="check">
                <input type="checkbox" id="courses" name="improvements" value="additional-courses">
                <label for="courses">Additional Courses</label>
            </div>
        </div>

        <div class="user-select">
            <label for="suggestions">Any comments or suggestions?</label>
        <textarea name="suggest" id="suggest" placeholder="Enter your comment here..." rows="4" ></textarea>
        </div>
        <button type="submit">Submit</button>
    </form>
</body>
</html>
